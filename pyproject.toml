[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handwerk-beleg-assistent"
version = "0.1.0"
description = "Offline document intake and job tracking for a fictional trade business"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "pydantic>=2.9,<3",
    "pypdf>=6.18,<8",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.2,<5",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
browser = ["playwright>=1.56,<2"]

[project.scripts]
beleg-assistent = "handwerk.cli:main"

[tool.setuptools.package-data]
handwerk = ["templates/*.html", "static/*.css"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.report]
precision = 2
